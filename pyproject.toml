[project]
name = "spot_vslam-dev"
version = "0.1.0"
description = "Development environment for the spot_vslam Isaac Lab project."
requires-python = ">=3.12,<3.13"
dependencies = [
    "spot_vslam",
    # PyCuVSLAM needs CUDA Toolkit 13 installed. (change depending on the cuda used)
    "cuvslam @ https://github.com/nvidia-isaac/cuVSLAM/releases/download/v17.0.0/cuvslam-17.0.0%2Bcu13-cp312-abi3-manylinux_2_39_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = ["pre-commit"]

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"
package = false

[tool.uv.sources]
"spot_vslam" = { workspace = true }

[tool.uv.workspace]
members = ["source/spot_vslam"]

[tool.ruff]
line-length = 120
target-version = "py312"
# old scripts nothing calls, kept as they were (scripts/legacy/README or docs/ROADMAP)
extend-exclude = ["scripts/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["spot_vslam"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "isaaclab",
    "isaaclab-rl",
    "isaaclab-tasks",
    "isaaclab-assets",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
isaaclab = ["isaaclab", "isaaclab_newton", "isaaclab_ov", "isaaclab_physx"]
"isaaclab-rl" = ["isaaclab_rl"]
"isaaclab-tasks" = ["isaaclab_tasks"]
"isaaclab-assets" = ["isaaclab_assets"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"scripts/**/*.py" = ["E402"]

[tool.ruff.format]
docstring-code-format = true

[[tool.uv.index]]
url = "https://pypi.nvidia.com"
explicit = false

[tool.codespell]
# Indonesian words in the Indonesian docs pages; ORB-SLAM3 path names
ignore-words-list = "sistem,tabel,lama,samping,thirdparty"
skip = "*.pth,*.pdf,*.png,*.zip,uv.lock,*/legacy/*"
